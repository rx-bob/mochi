version: '3'

vars:
  FRAG_CONFIG:
    sh: |
      if [ "$(uname -s)" = "Darwin" ]; then
        echo 'export LIBRARY_PATH="" && export DYLD_LIBRARY_PATH="{{.ROOT_DIR}}/fragments/libs" && export MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion)'
      else
        echo 'export LIBRARY_PATH="" && export LD_LIBRARY_PATH="{{.ROOT_DIR}}/fragments/libs"'
      fi
  EMCC_CONFIG:
    sh: |
      python="${EMSDK_PYTHON:-}"
      if [ -z "$python" ] && [ -x /opt/homebrew/bin/python3 ]; then
        python=/opt/homebrew/bin/python3
      fi
      if [ -z "$python" ]; then
        python=$(command -v python3)
      fi
      emscripten_prefix="${EMSCRIPTEN_PREFIX:-$(brew --prefix emscripten 2>/dev/null || true)}"
      llvm_bin="${EMSDK_LLVM_BIN:-${emscripten_prefix}/libexec/llvm/bin}"
      printf 'export EMSDK_PYTHON="%s"' "$python"
      if [ -n "$llvm_bin" ] && [ -d "$llvm_bin" ]; then
        printf ' && export PATH="%s:$PATH"' "$llvm_bin"
      fi
  SPEC_LINK_FLAGS: '--link-flags="-L{{.ROOT_DIR}}/fragments/libs"'
  BUILD_LINK_FLAGS:
    sh: |
      if [ "$(uname -s)" = "Darwin" ]; then
        if [ -f "{{.ROOT_DIR}}/fragments/libs/libsorbet.a" ]; then
          echo '--link-flags="-L{{.ROOT_DIR}}/fragments/libs -Wl,-force_load,{{.ROOT_DIR}}/fragments/libs/libsorbet.a -Wl,-ld_classic"'
        else
          echo '--link-flags="-L{{.ROOT_DIR}}/fragments/libs -Wl,-rpath,{{.ROOT_DIR}}/fragments/libs"'
        fi
      else
        echo '--link-flags="-L{{.ROOT_DIR}}/fragments/libs -Wl,--whole-archive,{{.ROOT_DIR}}/fragments/libs/libsorbet.a,--no-whole-archive"'
      fi
  COMPILER: '{{.ROOT_DIR}}/compiler/mochi'
  MOTESTPROJ: '{{.ROOT_DIR}}/compiler/motestproj'
  BUNDLE_DIR: '{{.ROOT_DIR}}/build_gvm'
  GVM_DIR: '{{.ROOT_DIR}}/../mochi-gvm'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the Crystal compiler binary
    sources:
      - compiler/src/**/*.cr
      - runtime/test/mochi_test_recorder.rb
      - e2e/mochi_test_runner.cjs
      - compiler/shard.yml
      - compiler/shard.lock
      - fragments/**/*
    generates:
      - compiler/mochi
    cmds:
      - |
        set -e
        {{.FRAG_CONFIG}}
        cd compiler
        sorbet_flag=
        if [ "$(uname -s)" != "Darwin" ] || [ -f "{{.ROOT_DIR}}/fragments/libs/libsorbet.a" ]; then
          sorbet_flag=-Dstatic_sorbet
        fi
        time crystal build src/mochi.cr $sorbet_flag -o mochi {{.BUILD_LINK_FLAGS}}
        if [ "$(uname -s)" = "Darwin" ]; then
          if otool -L mochi | grep -q '/usr/local/lib/libtree-sitter.0.27.dylib'; then
            install_name_tool -change /usr/local/lib/libtree-sitter.0.27.dylib "{{.ROOT_DIR}}/fragments/libs/libtree-sitter.dylib" mochi
          fi
        fi

  install:
    desc: Install the mochi command under ~/.local/bin
    cmds:
      - task: install:dev

  install:dev:
    desc: Install or update a source-checkout-backed mochi launcher under ~/.local
    deps:
      - build
    cmds:
      - ruby scripts/install_dev.rb install

  install:update:
    desc: Update an existing owned local mochi install
    cmds:
      - task: install:dev:update

  install:remove:
    desc: Remove the owned local mochi install
    cmds:
      - task: install:dev:remove

  install:dev:update:
    desc: Update an existing owned development launcher and resource record
    deps:
      - build
    cmds:
      - ruby scripts/install_dev.rb update

  install:dev:remove:
    desc: Remove only the launcher and record owned by a development install
    cmds:
      - ruby scripts/install_dev.rb remove

  install:dev:test:
    desc: Test temporary-prefix install, update, launcher use, and ownership-safe removal
    deps:
      - build
    cmds:
      - ruby scripts/install_dev_test.rb

  toolchain:package:
    desc: Package the macOS CLI and its optional prelinked desktop toolchain
    deps: [build]
    cmds:
      - ruby scripts/package_toolchain.rb --desktop

  toolchain:test:
    desc: Build and launch an app using a prebuilt macOS toolchain in an isolated prefix
    deps: [build]
    cmds:
      - ruby scripts/install_toolchain_test.rb

  stations:candidate:
    desc: Build and replay the station release archives using an isolated macOS toolchain install
    deps: ["toolchain:package"]
    cmds:
      - ruby scripts/stations_release.rb build build/toolchains build/stations-candidate

  specs:
    desc: Run Crystal compiler specs
    cmds:
      - |
        created=0
        if [ "$(uname -s)" = "Darwin" ] && [ ! -e "fragments/libs/libtree-sitter.0.27.dylib" ]; then
          ln -s libtree-sitter.dylib fragments/libs/libtree-sitter.0.27.dylib
          created=1
        fi
        {{.FRAG_CONFIG}}
        {{.EMCC_CONFIG}}
        cd compiler
        crystal spec {{.SPEC_LINK_FLAGS}}
        status=$?
        if [ "$created" -eq 1 ]; then rm -f ../fragments/libs/libtree-sitter.0.27.dylib; fi
        exit $status

  lint:
    desc: Lint the explicit positive project inventory
    deps:
      - build
    cmds:
      - |
        set -e
        {{.FRAG_CONFIG}}
        # Lint only tracked positive project fixtures. compiler/motestproj is a local
        # ignored scratch project and must not be required by the repository gate.
        # e2e/fixtures/feedback_review intentionally contains lint violations used
        # by browser tests, so it is not part of this positive inventory.
        "{{.COMPILER}}" lint -i "{{.ROOT_DIR}}/e2e/fixtures/ui_contracts"
        "{{.COMPILER}}" lint -i "{{.ROOT_DIR}}/e2e/fixtures/framework_contracts"
        "{{.COMPILER}}" lint -i "{{.ROOT_DIR}}/e2e/fixtures/gvm_counter"
        "{{.COMPILER}}" lint -i "{{.ROOT_DIR}}/e2e/fixtures/clay_inspector"
        "{{.COMPILER}}" lint -i "{{.ROOT_DIR}}/e2e/fixtures/clay_editor"
        "{{.COMPILER}}" lint -i "{{.ROOT_DIR}}/e2e/fixtures/clay_storage"
        "{{.COMPILER}}" lint -i "{{.ROOT_DIR}}/devground/components"
        sh "{{.ROOT_DIR}}/scripts/lint_cli_smoke.sh"

  run:
    desc: Build the compiler and compile motestproj into build_gvm
    deps:
      - build
    cmds:
      - '{{.FRAG_CONFIG}} && {{.COMPILER}} -i {{.MOTESTPROJ}} -o {{.BUNDLE_DIR}}'

  typecheck:
    desc: Typecheck the motestproj components with Sorbet
    deps:
      - build
    cmds:
      - '{{.FRAG_CONFIG}} && {{.COMPILER}} --typecheck -i {{.MOTESTPROJ}} -o {{.BUNDLE_DIR}}'

  dev:
    desc: Build motestproj and serve build_gvm on port 27490
    deps:
      - run
    cmds:
      - '{{.FRAG_CONFIG}} && {{.COMPILER}} dev --config={{.ROOT_DIR}}/config/dev_server_config.json --root={{.BUNDLE_DIR}}'

  e2e:
    desc: Run the explicit Cowboy application browser integration suite
    cmds:
      - task: app:e2e

  desktop:demo:
    desc: Build the experimental macOS inspector in build/desktop-mvp/Stations.app
    deps: [build]
    cmds:
      - '{{.FRAG_CONFIG}} && "{{.COMPILER}}" --target=desktop -i e2e/fixtures/clay_inspector -o build/desktop-mvp'

  desktop:test:
    desc: Verify inspector bundles and exercise AppKit Inspector and Editor controls
    deps: [build]
    cmds:
      - '{{.FRAG_CONFIG}} && runtime/desktop/test/run.sh'

  desktop:parity:
    desc: Compare the inspector in AppKit and all three browsers and save capture artifacts
    deps: [build]
    cmds:
      - |
        set -e
        {{.FRAG_CONFIG}}
        mkdir -p "{{.ROOT_DIR}}/build/desktop-parity"
        export MOCHI_PARITY_DIR="$(mktemp -d "{{.ROOT_DIR}}/build/desktop-parity/run.XXXXXX")"
        echo "Inspector captures: $MOCHI_PARITY_DIR"
        sh runtime/desktop/test/capture.sh "$MOCHI_PARITY_DIR"
        cd e2e
        npx playwright test tests/gvm_desktop_parity.spec.ts --grep "inspector capture parity" --reporter=line

  framework:e2e:
    desc: Run portable framework browser regressions without Cowboy
    deps:
      - build
    cmds:
      - task: framework:feedback
      - '{{.EMCC_CONFIG}} && cd e2e && npx playwright test tests/gvm_desktop_parity.spec.ts tests/gvm_portable_editor.spec.ts tests/gvm_portable_storage.spec.ts tests/gvm_counter.spec.ts tests/gvm_emit_fetch.spec.ts tests/gvm_row_capacity.spec.ts tests/gvm_framework_standalone.spec.ts tests/gvm_drag_file_contracts.spec.ts tests/gvm_pointer_contracts.spec.ts tests/gvm_ui_contracts.spec.ts tests/gvm_ui_capacity_lifecycle.spec.ts tests/gvm_computed.spec.ts tests/gvm_test_workflow.spec.ts tests/gvm_capacity_boundaries.spec.ts --reporter=line'
      - '{{.EMCC_CONFIG}} && cd e2e && npx playwright test tests/gvm_asset_paths.spec.ts tests/gvm_install_workflow.spec.ts tests/gvm_evolved_features.spec.ts --grep-invert "Cowboy integration" --reporter=line'

  framework:feedback:
    desc: Run portable feedback composition regressions in all browsers
    deps: [build]
    cmds:
      - '{{.EMCC_CONFIG}} && cd e2e && npx playwright test tests/gvm_feedback_review.spec.ts --reporter=line'

  framework:ui:
    desc: Run all shared UI fixture scenarios and feedback evidence in all browsers
    deps: [build]
    cmds:
      - '{{.EMCC_CONFIG}} && cd e2e && npx playwright test tests/gvm_ui_contracts.spec.ts tests/gvm_ui_capacity_lifecycle.spec.ts tests/gvm_computed.spec.ts tests/gvm_test_workflow.spec.ts tests/gvm_capacity_boundaries.spec.ts --reporter=line'

  framework:ui:inspector:
    desc: Run inspector Ruby scenarios and related feedback evidence
    deps: [build]
    cmds:
      - '{{.EMCC_CONFIG}} && cd e2e && npx playwright test tests/gvm_ui_contracts.spec.ts tests/gvm_ui_capacity_lifecycle.spec.ts tests/gvm_computed.spec.ts --grep "@ui-inspector" --reporter=line'

  framework:ui:graph:
    desc: Run graph Ruby scenarios, SVG insertion/identity checks, and related evidence
    deps: [build]
    cmds:
      - '{{.EMCC_CONFIG}} && cd e2e && npx playwright test tests/gvm_ui_contracts.spec.ts tests/gvm_ui_capacity_lifecycle.spec.ts --grep "@ui-graph" --reporter=line'

  framework:ui:form:
    desc: Run nested form Ruby scenarios, lifecycle checks, and related feedback evidence
    deps: [build]
    cmds:
      - '{{.EMCC_CONFIG}} && cd e2e && npx playwright test tests/gvm_ui_contracts.spec.ts tests/gvm_ui_capacity_lifecycle.spec.ts --grep "@ui-form" --reporter=line'

  app:e2e:
    desc: Build the Cowboy frontend and run its GVM Playwright integration suite
    deps:
      - build
    cmds:
      - |
        frontend_dir="${MOCHI_FRONTEND_DIR:-$(find "{{.ROOT_DIR}}/.." -mindepth 3 -maxdepth 3 -type f -path '*/frontend-mochi/Taskfile.yml' -print -quit | sed 's|/Taskfile.yml$||')}"
        test -f "$frontend_dir/Taskfile.yml"
        task --dir "$frontend_dir" check
        cd e2e
        MOCHI_FRONTEND_DIR="$frontend_dir" npx playwright test tests/gvm_evolved_features.spec.ts --grep "Cowboy integration" --reporter=line

  compile-time:test:
    desc: Verify the compile-time gate rejects an over-limit compiler invocation
    cmds:
      - node --test scripts/compile_time_gate.test.cjs

  compile-time:
    desc: Gate representative cold, warm, and edited application builds below one second
    deps:
      - build
    cmds:
      - node scripts/compile_time_gate.cjs

  check:
    desc: Run compile-time gate, then compiler, lint, payload, runtime, GVM, browser, and app checks
    cmds:
      - task: compile-time:test
      - task: compile-time:framework
      - task: runtime:test
      - task: specs
      - task: lint
      - task: payload
      - task: gvm:test
      - task: framework:e2e

  app:check:
    desc: Run complete Cowboy compile-time and browser integration gates
    deps:
      - build
    cmds:
      - task: compile-time
      - task: app:e2e

  compile-time:framework:
    desc: Gate the portable minimal app below one second
    deps:
      - build
    cmds:
      - node scripts/compile_time_gate.cjs --fixture minimal

  payload:
    desc: Check deterministic bundle membership and payload ceilings
    deps:
      - build
    cmds:
      - ruby scripts/payload_check.rb

  runtime:test:
    desc: Run the loader and host adapter runtime tests
    dir: runtime
    cmds:
      - npm test

  gvm:test:
    desc: Run the mochi-gvm Goose test suite
    dir: '{{.GVM_DIR}}'
    cmds:
      - goosetest test

  gvm:fmt:
    desc: Check mochi-gvm Goose formatting
    dir: '{{.GVM_DIR}}'
    cmds:
      - 'find . -name "*.goose" -not -path "./goosetest_generated/*" -not -path "./references/*" -print0 | xargs -0 goosefmt --check'

  gvm:wasm:
    desc: Rebuild the mochi-gvm WASM and JS artifacts
    dir: '{{.GVM_DIR}}'
    cmds:
      - |
        set -e
        if [ -z "${EMSDK_PYTHON:-}" ]; then
          if [ -x /opt/homebrew/bin/python3 ]; then
            EMSDK_PYTHON=/opt/homebrew/bin/python3
          else
            EMSDK_PYTHON=$(command -v python3)
          fi
        fi
        export EMSDK_PYTHON
        emscripten_prefix="${EMSCRIPTEN_PREFIX:-$(brew --prefix emscripten 2>/dev/null || true)}"
        llvm_bin="${EMSDK_LLVM_BIN:-${emscripten_prefix}/libexec/llvm/bin}"
        if [ -d "$llvm_bin" ]; then
          export PATH="$llvm_bin:$PATH"
        fi
        goose run scripts/build_wasm.goose

  generate-batteries:
    desc: Regenerate the built-in battery sources
    cmds:
      - ruby scripts/fragments_generator.rb
      - crystal tool format ./compiler/src/generated
