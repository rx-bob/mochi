version: '3'

vars:
  FRAG_CONFIG:
    sh: |
      if [ "$(uname -s)" = "Darwin" ]; then
        echo 'export LIBRARY_PATH="" && export DYLD_LIBRARY_PATH="{{.ROOT_DIR}}/fragments/libs" && export MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion)'
      else
        echo 'export LIBRARY_PATH="" && export LD_LIBRARY_PATH="{{.ROOT_DIR}}/fragments/libs"'
      fi
  SPEC_LINK_FLAGS: '--link-flags="-L{{.ROOT_DIR}}/fragments/libs"'
  BUILD_LINK_FLAGS:
    sh: |
      if [ "$(uname -s)" = "Darwin" ]; then
        echo '--link-flags="-L{{.ROOT_DIR}}/fragments/libs -Wl,-force_load,{{.ROOT_DIR}}/fragments/libs/libsorbet.a -Wl,-ld_classic"'
      else
        echo '--link-flags="-L{{.ROOT_DIR}}/fragments/libs -Wl,-force_load,{{.ROOT_DIR}}/fragments/libs/libsorbet.a"'
      fi
  COMPILER: '{{.ROOT_DIR}}/compiler/mochi'
  MOTESTPROJ: '{{.ROOT_DIR}}/compiler/motestproj'
  BUNDLE_DIR: '{{.ROOT_DIR}}/build_gvm'
  GVM_DIR: '{{.ROOT_DIR}}/../mochi-gvm'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the Crystal compiler binary
    sources:
      - compiler/src/**/*.cr
      - compiler/shard.yml
      - compiler/shard.lock
      - fragments/**/*
    generates:
      - compiler/mochi
    cmds:
      - |
        set -e
        {{.FRAG_CONFIG}}
        cd compiler
        time crystal build src/mochi.cr -Dstatic_sorbet -o mochi {{.BUILD_LINK_FLAGS}}
        if [ "$(uname -s)" = "Darwin" ]; then
          if otool -L mochi | grep -q '/usr/local/lib/libtree-sitter.0.27.dylib'; then
            install_name_tool -change /usr/local/lib/libtree-sitter.0.27.dylib "{{.ROOT_DIR}}/fragments/libs/libtree-sitter.dylib" mochi
          fi
        fi

  specs:
    desc: Run Crystal compiler specs
    cmds:
      - |
        created=0
        if [ "$(uname -s)" = "Darwin" ] && [ ! -e "fragments/libs/libtree-sitter.0.27.dylib" ]; then
          ln -s libtree-sitter.dylib fragments/libs/libtree-sitter.0.27.dylib
          created=1
        fi
        {{.FRAG_CONFIG}}
        cd compiler
        crystal spec {{.SPEC_LINK_FLAGS}}
        status=$?
        if [ "$created" -eq 1 ]; then rm -f ../fragments/libs/libtree-sitter.0.27.dylib; fi
        exit $status

  run:
    desc: Build the compiler and compile motestproj into build_gvm
    deps:
      - build
    cmds:
      - '{{.FRAG_CONFIG}} && {{.COMPILER}} -i {{.MOTESTPROJ}} -o {{.BUNDLE_DIR}}'

  typecheck:
    desc: Typecheck the motestproj components with Sorbet
    deps:
      - build
    cmds:
      - '{{.FRAG_CONFIG}} && {{.COMPILER}} --typecheck -i {{.MOTESTPROJ}} -o {{.BUNDLE_DIR}}'

  dev:
    desc: Build motestproj and serve build_gvm on port 27490
    deps:
      - run
    cmds:
      - '{{.FRAG_CONFIG}} && {{.COMPILER}} dev --config={{.ROOT_DIR}}/config/dev_server_config.json --root={{.BUNDLE_DIR}}'

  e2e:
    desc: Run the GVM Playwright end-to-end test
    deps:
      - build
    cmds:
      - 'cd e2e && npx playwright test tests/gvm_counter.spec.ts --reporter=line'

  check:
    desc: Run compiler specs, GVM tests, and GVM E2E
    cmds:
      - task: specs
      - task: gvm:test
      - task: e2e

  gvm:test:
    desc: Run the mochi-gvm Goose test suite
    dir: '{{.GVM_DIR}}'
    cmds:
      - goosetest test

  gvm:fmt:
    desc: Check mochi-gvm Goose formatting
    dir: '{{.GVM_DIR}}'
    cmds:
      - 'find . -name "*.goose" -not -path "./goosetest_generated/*" -not -path "./references/*" -print0 | xargs -0 goosefmt --check'

  gvm:wasm:
    desc: Rebuild the mochi-gvm WASM and JS artifacts
    dir: '{{.GVM_DIR}}'
    cmds:
      - |
        set -e
        if [ -z "${EMSDK_PYTHON:-}" ]; then
          if [ -x /opt/homebrew/bin/python3 ]; then
            EMSDK_PYTHON=/opt/homebrew/bin/python3
          else
            EMSDK_PYTHON=$(command -v python3)
          fi
        fi
        export EMSDK_PYTHON
        emscripten_prefix="${EMSCRIPTEN_PREFIX:-$(brew --prefix emscripten 2>/dev/null || true)}"
        llvm_bin="${EMSDK_LLVM_BIN:-${emscripten_prefix}/libexec/llvm/bin}"
        if [ -d "$llvm_bin" ]; then
          export PATH="$llvm_bin:$PATH"
        fi
        goose run scripts/build_wasm.goose

  generate-batteries:
    desc: Regenerate the built-in battery sources
    cmds:
      - ruby scripts/fragments_generator.rb
      - crystal tool format ./compiler/src/generated
