<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>yiseq mruby WASM Demo</title>
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
  h1 { color: #333; }
  .status { padding: 15px; border-radius: 4px; margin: 10px 0; }
  .ok { background: #d4edda; color: #155724; }
  .error { background: #f8d7da; color: #721c24; }
  .info { background: #e2e3e5; color: #383d41; }
  .log { font-family: monospace; background: #f5f5f5; padding: 10px; border-radius: 4px; max-height: 400px; overflow-y: auto; }
  .export-row { padding: 4px 0; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<h1>yiseq mruby WASM Demo</h1>
<p>This page loads the mruby-based Emscripten runtime and verifies all ABI exports are callable.</p>

<div id="status" class="status info">Loading Emscripten module...</div>
<div id="log" class="log"></div>

<script src="mochi-ruby-micro.js"></script>
<script>
(function() {
  var logEl = document.getElementById('log');
  var statusEl = document.getElementById('status');
  function log(msg) {
    var line = document.createElement('div');
    line.textContent = msg;
    logEl.appendChild(line);
    console.log('[mochi]', msg);
  }

  log('mochi-ruby-micro.js loaded');
  log('Module factory: ' + (typeof MochiModule));

  if (typeof MochiModule !== 'function') {
    statusEl.textContent = 'FATAL: MochiModule factory not found';
    statusEl.className = 'status error';
    log('MochiModule is not a function: ' + typeof MochiModule);
    return;
  }

  MochiModule().then(function(Module) {
    log('Module is ready (calledRun=' + Module.calledRun + ')');

    var required = [
      'mochi_init_runtime',
      'mochi_hydrate_component',
      'mochi_process_events',
      'mochi_render_buffer_offset',
      'mochi_event_buffer_offset',
      'mochi_load_iseq',
      'mochi_malloc',
      'mochi_render',
      'mochi_write_event',
      'mochi_reset_events'
    ];

    var allOk = true;
    var exportDiv = document.createElement('div');

    required.forEach(function(name) {
      var fn = Module.cwrap(name, 'number', []);
      var ok = (typeof fn === 'function');
      var row = document.createElement('div');
      row.className = 'export-row';
      row.textContent = (ok ? 'OK' : 'MISSING') + ': ' + name + (ok ? ' (cwrap ready)' : '');
      exportDiv.appendChild(row);
      if (!ok) allOk = false;
    });

    // Test mochi_malloc
    var malloc = Module.cwrap('mochi_malloc', 'number', ['number']);
    var ptr = malloc(64);
    log('mochi_malloc(64) -> ptr=' + ptr);

    // Test mochi_init_runtime
    var init = Module.cwrap('mochi_init_runtime', 'number', []);
    var initResult = init();
    log('mochi_init_runtime() -> ' + initResult);

    logEl.appendChild(exportDiv);

    if (allOk && ptr > 0) {
      statusEl.textContent = 'mruby WASM loaded + all ABI functions callable!';
      statusEl.className = 'status ok';
    } else {
      statusEl.textContent = 'Some ABI functions missing or malloc failed';
      statusEl.className = 'status error';
    }
  }).catch(function(err) {
    statusEl.textContent = 'FATAL: ' + err.message;
    statusEl.className = 'status error';
    log('Error: ' + err.message);
    log('Stack: ' + (err.stack || 'no stack'));
  });
})();
</script>
</body>
</html>
