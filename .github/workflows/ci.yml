name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write       # Required for test reporting
  pull-requests: write  # Required for PR comments

jobs:
  All:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout mochi-gvm sources
        uses: actions/checkout@v4
        with:
          repository: rx-bob/mochi-gvm
          ref: 31e1a0169c4c4da5e18a804d6dee10528e483ad7
          path: mochi-gvm

      - name: Checkout mruby source
        uses: actions/checkout@v4
        with:
          repository: mruby/mruby
          ref: 087da64f991d0ff82c2bbb6376532cbfa55056de
          path: build_wasm/mruby/src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the shipped loader against its source
        working-directory: runtime
        run: |
          npm ci --ignore-scripts
          npm run check:loader

      - name: Install the WOFF2 decoder
        run: sudo apt-get update && sudo apt-get install -y woff2

      - name: Install Zig
        run: |
          wget https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -xf zig-x86_64-linux-0.15.2.tar.xz
          sudo mv zig-x86_64-linux-0.15.2 /usr/local/zig
          echo "/usr/local/zig" >> $GITHUB_PATH

      - name: Build libpftrace
        run: cd fragments/vendor/libpftrace && zig build

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: devground/components

      - name: Build mruby host compiler
        run: |
          cd build_wasm/mruby/src
          ruby minirake -j2
          test -x build/host/bin/mrbc
          echo "MRBC=$GITHUB_WORKSPACE/build_wasm/mruby/src/build/host/bin/mrbc" >> "$GITHUB_ENV"

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.9

      - name: Setup Goose compiler
        run: |
          archive="$RUNNER_TEMP/goose-v2026.4-linux-x64.tar.gz"
          curl -fsSL https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz -o "$archive"
          echo "559ad7572df89fcd1273512d8679528bcdf876c252ec1f31608d3808b24125b3  $archive" | sha256sum --check
          install_dir="$RUNNER_TEMP/goose-v2026.4"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          goose_bin="$(find "$install_dir" -type f -name goose -perm -u+x -print -quit)"
          test -n "$goose_bin"
          echo "$(dirname "$goose_bin")" >> "$GITHUB_PATH"

      - name: Build GVM runtime
        run: |
          echo "$EMSDK/upstream/bin" >> "$GITHUB_PATH"
          export PATH="$EMSDK/upstream/bin:$PATH"
          command -v emcc
          command -v goose
          command -v wasm-opt
          cd mochi-gvm
          goose run scripts/build_wasm.goose
          echo "MOCHI_GVM_DIR=$GITHUB_WORKSPACE/mochi-gvm" >> "$GITHUB_ENV"

      - name: Install Crystal dependencies
        run: cd compiler && shards install

      - name: Generate batteries (required files)
        run: |
          ruby scripts/fragments_generator.rb
          crystal tool format ./compiler/src/generated

      - name: Debug Libsorbet Dependencies
        run: |
          ls -l fragments/libs/libsorbet.so
          ldd fragments/libs/libsorbet.so
          echo "Checking spec files:"
          ls -R compiler/spec

      - name: Run Crystal Specs
        run: |
          cd compiler
          mkdir -p test-results

          echo "--- Running Specs (Verbose) ---"
          crystal spec -v --junit_output test-results/output.xml --link-flags="-L$GITHUB_WORKSPACE/fragments/libs -Wl,-rpath,$GITHUB_WORKSPACE/fragments/libs"

          echo "--- Checking for JUnit output ---"
          ls -la test-results/ || echo "test-results directory not found"

          if [ -f test-results/output.xml ]; then
            echo "JUnit XML file created successfully"
            head -20 test-results/output.xml
          else
            echo "WARNING: JUnit XML file was not created"
          fi
        env:
          MOCHI_GVM_DIR: ${{ github.workspace }}/mochi-gvm
          MRBC: ${{ github.workspace }}/build_wasm/mruby/src/build/host/bin/mrbc

      - name: Install Playwright dependencies
        run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps

      - name: Build Mochi compiler
        run: |
          cd compiler
          crystal build src/mochi.cr -o mochi --link-flags="-L$GITHUB_WORKSPACE/fragments/libs -Wl,-rpath,$GITHUB_WORKSPACE/fragments/libs"
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/fragments/libs

      - name: Lint positive Ruby projects
        run: |
          ./compiler/mochi lint -i e2e/fixtures/gvm_counter
          ./compiler/mochi lint -i e2e/fixtures/ui_contracts
          ./compiler/mochi lint -i e2e/fixtures/framework_contracts
          ./compiler/mochi lint -i devground/components
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/fragments/libs

      - name: Compile Mochi for E2E tests
        run: ./compiler/mochi -i devground/components -o build/ci-devground
        env:
          MO_INT_LOGS: false
          MO_INT_LOGS_LEVEL: INFO
          LD_LIBRARY_PATH: ${{ github.workspace }}/fragments/libs

      - name: Run Playwright tests
        run: >-
          cd e2e && npx playwright test
          tests/gvm_feedback_review.spec.ts
          tests/gvm_counter.spec.ts
          tests/gvm_emit_fetch.spec.ts
          tests/gvm_row_capacity.spec.ts
          tests/gvm_framework_standalone.spec.ts
          tests/gvm_desktop_parity.spec.ts
          tests/gvm_portable_editor.spec.ts
          tests/gvm_portable_storage.spec.ts
          tests/gvm_drag_file_contracts.spec.ts
          tests/gvm_pointer_contracts.spec.ts
          tests/gvm_ui_contracts.spec.ts
          tests/gvm_ui_capacity_lifecycle.spec.ts
          tests/gvm_computed.spec.ts
          tests/gvm_test_workflow.spec.ts
          tests/gvm_capacity_boundaries.spec.ts
          tests/gvm_asset_paths.spec.ts
          tests/gvm_install_workflow.spec.ts
          tests/gvm_evolved_features.spec.ts
          --grep-invert "Cowboy integration"
        continue-on-error: true  # Allow test report step to run even if tests fail

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            compiler/test-results/*.xml
            e2e/test-results/*.xml

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Publish Crystal Spec Report
        uses: mikepenz/action-junit-report@v4
        if: always()  # Run even if tests fail
        with:
          report_paths: compiler/test-results/*.xml
          check_name: Crystal Spec Results
          detailed_summary: true
          include_passed: true
          fail_on_failure: true

      - name: Publish E2E Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()  # Run even if tests fail
        with:
          report_paths: e2e/test-results/*.xml
          check_name: E2E Test Results
          detailed_summary: true
          include_passed: true
          fail_on_failure: true

  InspectorParity:
    name: Inspector parity on macOS
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MOCHI_GVM_DIR: ${{ github.workspace }}/mochi-gvm
      MRBC: ${{ github.workspace }}/build_wasm/mruby/src/build/host/bin/mrbc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/checkout@v4
        with:
          repository: rx-bob/mochi-gvm
          ref: 1315325c1eb2ba2e50c24fc6447377f6cb365c8c
          path: mochi-gvm

      - uses: actions/checkout@v4
        with:
          repository: mruby/mruby
          ref: 087da64f991d0ff82c2bbb6376532cbfa55056de
          path: build_wasm/mruby/src

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.9

      - name: Install macOS build dependencies
        run: |
          brew install crystal go-task woff2 binaryen
          cd "$RUNNER_TEMP"
          curl -fsSLO https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          echo '3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b  zig-aarch64-macos-0.15.2.tar.xz' | shasum -a 256 -c -
          tar -xf zig-aarch64-macos-0.15.2.tar.xz
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.15.2" >> "$GITHUB_PATH"
          curl -fsSLO https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-macos-arm64.tar.gz
          echo '8ef0b5a864a719bd095b8376bed069d0edc77a0ce8f3cb9d59fdf87291a3a922  goose-v2026.4-macos-arm64.tar.gz' | shasum -a 256 -c -
          mkdir goose
          tar -xzf goose-v2026.4-macos-arm64.tar.gz -C goose
          goose_bin=$(find "$RUNNER_TEMP/goose" -type f -name goose -perm -u+x -print -quit)
          test -n "$goose_bin"
          dirname "$goose_bin" >> "$GITHUB_PATH"

      - name: Prepare the compiler and both GVM targets
        run: |
          (cd fragments/vendor/libpftrace && zig build)
          (cd build_wasm/mruby/src && ruby minirake -j2)
          test -x "$MRBC"
          export PATH="$EMSDK/upstream/bin:$PATH"
          (cd mochi-gvm && goose run scripts/build_wasm.goose)
          (cd compiler && shards install)
          ruby scripts/fragments_generator.rb
          crystal tool format compiler/src/generated

      - name: Install the comparison browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium firefox webkit

      - name: Verify the native ABI and mount lifecycle
        run: scripts/run_capped.sh 360 build/desktop-parity/native-abi.log task desktop:test

      - name: Compare recorded inspector states
        run: scripts/run_capped.sh 360 build/desktop-parity/run.log task desktop:parity

      - name: Verify station release candidates from an installed toolchain
        run: scripts/run_capped.sh 600 build/stations-candidate.log task stations:candidate

      - name: Upload verified local release candidates
        uses: actions/upload-artifact@v4
        with:
          name: stations-local-macos-arm64
          if-no-files-found: error
          path: |
            build/stations-candidate/run.*/*.zip
            build/toolchains/mochi*-macos-arm64.tar.gz

      - name: Upload inspector captures and comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-parity-macos
          path: |
            build/desktop-parity/
            build/stations-candidate.log
